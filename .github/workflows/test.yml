name: 🧪 test
on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pytest:
        name: 🧪 pytest
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install
              run: pip install '.[test]'
            - name: Test
              run: python -m pytest -q
