[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fks-mcp"
version = "0.1.0"
description = "The FKS edge ladder as MCP tools, over the platform's API v1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fks-mcp = "fks_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["fks_mcp"]
